<div class="rule">
    <h4>
        一般資訊</h4>
    <ul>
        <li>報告總結在選定產品以及時間內的活躍會員人數。這些會員會以產品以及月份來分組。 </li>
        <li>活躍會員是指該會員在選定時間範圍內有進行投注活動。 </li>
        <li>數據將會以01/012015開始直到當日前一天。數據範圍為三個月內。 </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        搜索篩檢程式</h4>
    <ul>
        <li><b>貨幣:</b> 提供以貨幣篩選活躍會員人數。 
            <ul>
                <li><b>全部:</b> 顯示全部貨幣之活躍會員人數。 </li>
            </ul>
        </li>
        <li>
            <b>產品: </b> 提供以產品篩選活躍會員人數。 
        </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        報告指南</h4>
    <ul>
        <li><b>產品:</b> 會員所下注的產品類別。 </li>
        <li><b>月份:</b> 在選擇的月份所下注的會員人數。 </li>
    </ul>
</div>
