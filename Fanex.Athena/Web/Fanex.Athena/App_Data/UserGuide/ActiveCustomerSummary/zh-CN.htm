<div class="rule">
    <h4>
        一般信息</h4>
    <ul>
        <li>报告总结在选定产品以及时间内的活跃会员人数。这些会员会以产品以及月份来分组。 </li>
        <li>活跃会员是指该会员在选定时间范围内有进行投注活动。 </li>
        <li>数据将会以01/012015开始直到当日前一天。数据范围为三个月内。 </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        搜索过滤器</h4>
    <ul>
        <li><b>货币:</b> 提供以货币筛选活跃会员人数。 
            <ul>
                <li><b>全部:</b> 显示全部货币之活跃会员人数。 </li>
            </ul>
        </li>
        <li>
            <b>产品:</b> 提供以产品筛选活跃会员人数。  
        </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        报告指南</h4>
    <ul>
        <li><b>产品:</b> 会员所下注的产品类别。 </li>
        <li><b>月份:</b> 在选择的月份所下注的会员人数。 </li>
    </ul>
</div>
