<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
          "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title>Jasmine Spec Runner</title>
    <link rel="shortcut icon" type="image/png" href="/Content/jasmine/jasmine_favicon.png">
    <link rel="stylesheet" type="text/css" href="/node_modules/jasmine-core/lib/jasmine-core/jasmine.css">
    <script type="text/javascript">
        _page = { lang: 'en-US' };
        _language_en_US = {};
    </script>
    
    <script src="/node_modules/requirejs/require.js"></script>
    <script>
        requirejs.config({
            baseUrl: '/www/js/source',
            paths: {
                'jasmine': '/node_modules/jasmine/lib/jasmine',
                'jasmine-html': '/node_modules/jasmine-core/lib/jasmine-core/jasmine-html',
                'jasmine-boot': '/node_modules/jasmine-core/lib/jasmine-core/boot',
                'jasmine-jquery': '/node_modules/jasmine-jquery/lib/jasmine-jquery',

                'jquery': '/node_modules/jquery/dist/jquery.min',
                'vendor-materialize': 'vendors/materialize/materialize'
            },
            shim: {
                'jasmine-html': {
                    deps: ['jasmine']
                },
                'jasmine-boot': {
                    deps: ['jasmine', 'jasmine-html']
                }
            }
        });

        var requiredModules = ['jasmine-boot'];
        require(requiredModules, function () {
            require(['/www/js/tests/common/querystring-spec.js'], function () {
                window.onload();
            });
        });
    </script>
</head>
<body>
</body>
</html>
