<div class="rule">
    <h4>
        一般資訊
    </h4>
    <ul>
        <li>您可以透過此功能查看會員創建/最後交易的時間和管理會員設定。 </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        搜索篩檢程式
    </h4>
    <ul>
        <li><b>用戶名:</b>搜尋外部ID或系統ID。 </li>
        <li><b>查看由:</b>查閱關於所有設置或某一特定設置，如BA、狀態、特別級別與貨幣的更改。預設情況下，為選定“全部”選項。 </li>
        <li><b>检阅每月數據:</b>可查閱一個月內登錄資訊。 </li>
        <li><b>顯示舊值:</b>可查閱更改舊值，舊值會以紅色標示。 </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        報告指南
    </h4>
    <ul>
        <li><b>簡介:</b>查閱玩家的歷史登錄資訊。
            <ul>
                <li><b>創建日期：</b>會員所創建的日期時間。 </li>
                <li><b>最新成交：</b>最後成交日期。 </li>
            </ul>
        </li>
        <li><b>客户設定:</b>管理帳戶更改設置。 </li>
        <li><b>群組傭金:</b>管理會員群組傭金的變更。 </li>
    </ul>
</div>
