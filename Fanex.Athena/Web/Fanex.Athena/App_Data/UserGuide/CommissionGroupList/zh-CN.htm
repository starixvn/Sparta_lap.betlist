<div class="rule">
    <h4>
        一般信息
    </h4>
    <ul>
        <li>本功能提供承租公司监控” 佣金组别列表”功能。 </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        报告指南
    </h4>
    <ul>
        <li><b>新组别:</b> 建置新的佣金组别。 </li>
        <li><b>组别名称:</b> 点选组别名称进行查看/编辑设定。 </li>
        <li><b>会员数:</b> 显示该组别的会员数，点选数字显示详细会员名单。 </li>
        <li><span>
            <img style="width: 16px; height: 16px;" src="/Content/Customer/images/edit.png" /></span>:
            编辑所选择的佣金组别。 </li>
        <li><span>
            <img style="width: 16px; height: 16px;" src="/Content/Customer/images/validatefail.png"></span>:
            删除所选择的佣金组别。
            <ul>
                <li><b>保持当前的佣金:</b> 删除组别，但是仍然保留现有组别的佣金比率。 </li>
                <li><b>清除客户的佣金:</b> 删除组别，并删除所有佣金比率。 </li>
            </ul>
        </li>
    </ul>
</div>
