<div class="rule">
    <h4>
        一般信息
    </h4>
    <ul>
        <li>本功能提供优胜冠军投注的预测。 </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        搜索过滤器
    </h4>
    <ul>
        <li><b>货币：</b>以货币来进行筛选。
            <ul>
                <li><b>全部:</b>列出所有支持的货币。 </li>
            </ul>
        </li>
        <li><b>基础货币：</b>将所有资料转换为基础货币但仅供参考。</li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        报告指南
    </h4>
    <ul>
        <li><b></b>队伍:球队/球员名. 点击显示所选球队/球员的所有投注的列表。 </li>
        <li><b></b>余额: 一个球队/球员的所有投注额总和。 </li>
        <li><b></b>预测: 在球队/球员赢的情况下预测承租公司的输赢。
            <ul>
                <li><b>负数: </b>表示承租公司赢多于输。 </li>
                <li><b>正数: </b>表示承租公司输多于赢。 </li>
            </ul>
        </li>
    </ul>
</div>
