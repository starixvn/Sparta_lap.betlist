
<div class="rule">
    <h4>
        一般資訊
    </h4>
    <ul>
        <li>本功能提供承租公司監控” 傭金組別列表”功能。 </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        報告指南
    </h4>
    <ul>
        <li><b>新組別:</b> 建置新的傭金組別。 </li>
        <li><b>組別名稱:</b> 點選組別名稱進行查看/編輯設定。 </li>
        <li><b>會員數:</b> 顯示該組別的會員數，點選數字顯示詳細會員名單。 </li>
        <li><div class="icon-edit"></div>:
            編輯所選擇的傭金組別。 </li>
        <li><div class="icon-delete"></div>:
            刪除所選擇的傭金組別。
            <ul>
                <li><b>保持當前的傭金:</b> 刪除組別，但是仍然保留現有組別的傭金比率。 </li>
                <li><b>清除客戶的傭金:</b> 刪除組別，並刪除所有傭金比率。 </li>
            </ul>
        </li>
    </ul>
</div>
