    </h4>
    <ul>
        <li>本报表提供承租公司针对赛事不同比分所产生的输赢金额预测。 </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        搜索过滤器
    </h4>
    <ul>
        <li><b>货币：</b>以货币来进行筛选。
            <ul>
                <li><b>全部：</b>列出所有支持的货币。 </li>
            </ul>
        </li>
        <li><b>基于欧元/美元：</b>所有数据将转换为欧元/美元，仅供参考之用。基于货币列表包括欧元、美元和一个动态货币选项。动态货币选项会因货币栏内选择的特定货币而不同（除了欧元和美元以外）。
        </li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>
        报告指南
    </h4>
    <ul>
        <li><b>让球:</b> 让球注单的预测。
            <ul>
                <li><b>正数金额:</b> 预测承租公司会输大于赢。 </li>
                <li><b>负数金额: </b>预测承租公司会赢大于输。 </li>
            </ul>
        </li>
        <li><b>大小:</b> 大/小注单的预测。 </li>
        <li><div class="icon-view-betlist">:
            显示指定赛事的预测以及注单信息。 </li>
